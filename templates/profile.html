<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Barangay Sto. Niño</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-800: #0f3d2a;
            --primary-700: #145233;
            --primary-600: #1a6b42;
            --primary-500: #228b54;
            --accent-600: #c42828;
            --neutral-50: #f4f8f5;
            --neutral-100: #dde8e1;
            --neutral-500: #6b8475;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--neutral-50); min-height: 100vh; }

        /* ===== SIDEBAR (GREEN) ===== */
        .sidebar {
            width: 260px; height: 100vh; background: linear-gradient(180deg, var(--primary-800), var(--primary-600));
            position: fixed; left: 0; top: 0;
            box-shadow: 2px 0 12px rgba(0,0,0,0.06); padding: 24px 20px; display: flex; flex-direction: column;
            transition: all 0.3s ease; z-index: 100;
        }
        .sidebar-brand {
            display: flex; align-items: center; gap: 12px; padding-bottom: 28px; border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 24px;
        }
        .sidebar-brand .logo-img {
            width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex;
            align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 18px;
        }
        .sidebar-brand h4 { color: white; font-weight: 700; font-size: 1rem; }
        .sidebar-brand small { display: block; color: rgba(255,255,255,0.7); font-size: 0.7rem; font-weight: 400; }

        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px;
            color: rgba(255,255,255,0.8); text-decoration: none; font-weight: 500; font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .sidebar-nav a i { width: 20px; text-align: center; font-size: 1rem; }
        .sidebar-nav a:hover { background: rgba(255,255,255,0.1); color: white; }
        .sidebar-nav a.active { background: rgba(255,255,255,0.2); color: white; font-weight: 600; }
        .sidebar-nav a.active i { color: white; }
        .sidebar-nav .logout { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 16px; color: white; }
        .sidebar-nav .logout:hover { background: rgba(255,0,0,0.2); color: white; }

        /* ===== MAIN CONTENT ===== */
        .main-content { margin-left: 260px; padding: 30px 40px; min-height: 100vh; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .page-header h1 { font-size: 1.8rem; font-weight: 700; color: var(--primary-800); }
        .page-header p { color: var(--neutral-500); font-size: 0.9rem; margin-top: 4px; }

        /* ===== PROFILE CARD ===== */
        .profile-card {
            background: white; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            width: 100%; overflow: hidden; border: 1px solid #f0f1f3;
        }

        /* ===== BAGONG WHITE HEADER ===== */
        .profile-header {
            background: white; /* Puti na siya! */
            padding: 20px 30px; 
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #f0f1f3; /* May linya sa baba para hiwalay sa form */
        }

        .profile-avatar {
            width: 55px; height: 55px; border-radius: 50%; 
            background: var(--neutral-100); /* Light grey na background */
            color: var(--primary-600);
            display: flex; align-items: center; justify-content: center; 
            font-size: 2rem; flex-shrink: 0;
        }

        .profile-header h2 { font-size: 1.3rem; font-weight: 700; color: var(--primary-800); }
        .profile-header p { font-size: 0.9rem; color: var(--neutral-500); margin-top: 2px; }

        .profile-body { padding: 30px; }

        /* ===== FORM SECTIONS ===== */
        .info-section { margin-bottom: 30px; }
        .info-section h3 {
            font-size: 1rem; font-weight: 700; color: var(--primary-800); margin-bottom: 12px;
            padding-bottom: 8px; border-bottom: 2px solid var(--neutral-100);
        }

        .info-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;
        }

        .form-group {
            display: flex; flex-direction: column;
        }

        .form-group label {
            display: block; font-size: 0.75rem; font-weight: 600; color: var(--neutral-500);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
        }

        .form-group input {
            font-size: 1rem; font-weight: 500; color: var(--primary-800); background: var(--neutral-50);
            padding: 10px 14px; border-radius: 8px; border: 1.5px solid var(--neutral-100);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none; border-color: var(--primary-500); background: white;
            box-shadow: 0 0 0 4px rgba(34, 139, 84, 0.1);
        }

        .form-group input[readonly] {
            background: #f0f0f0; border-color: #e0e0e0; cursor: not-allowed; opacity: 0.7;
        }

        /* ===== PASSWORD FIELD WITH EYE ICON ===== */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 45px; /* Para may space yung eye icon */
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #7a8f82;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .toggle-password:hover {
            color: var(--primary-600);
        }

        /* ===== PASSWORD SECTION ===== */
        .password-section { margin-top: 20px; }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 24px; border-radius: 10px; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; text-decoration: none; border: none;
        }
        .btn-primary { background: var(--primary-600); color: white; }
        .btn-primary:hover { background: var(--primary-700); transform: translateY(-2px); box-shadow: 0 8px 16px -6px rgba(26, 107, 66, 0.4); }
        .btn-secondary { background: var(--neutral-50); color: var(--primary-800); border: 1px solid var(--neutral-100); }
        .btn-secondary:hover { background: var(--neutral-100); }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; }
            .info-grid { grid-template-columns: 1fr; }
            .profile-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR (GREEN) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="logo-img">SN</div>
            <div>
                <h4>Barangay Sto. Niño</h4>
                <small>Online Services</small>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="/request-document"><i class="fas fa-file-alt"></i> Request Document</a>
            <a href="/apply-permit"><i class="fas fa-calendar-check"></i> Apply for Permit</a>
            <a href="/my-requests"><i class="fas fa-list"></i> My Requests</a>
            <a href="/events"><i class="fas fa-calendar-alt"></i> Events</a>
            <a href="/profile" class="active"><i class="fas fa-user-edit"></i> My Profile</a>
            <a href="/logout" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="page-header">
            <div>
                <h1>My Profile</h1>
                <p>Update your personal information</p>
            </div>
        </div>

        <div class="profile-card">
            <!-- BAGONG WHITE HEADER (WALA NG GREEN BG) -->
            <div class="profile-header">
                <div class="profile-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div>
                    <h2>{{ session['fullname'] }}</h2>
                    <p>{{ user['email'] }}</p>
                </div>
            </div>

            <div class="profile-body">

                <!-- EDIT PROFILE FORM -->
                <div class="info-section">
                    <h3><i class="fas fa-user" style="margin-right: 8px;"></i> Personal Information</h3>
                    <form method="POST" action="{{ url_for('update_profile') }}">
                        <div class="info-grid">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" name="first_name" value="{{ user['first_name'] }}" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" name="last_name" value="{{ user['last_name'] }}" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address (Cannot be changed)</label>
                                <input type="email" value="{{ user['email'] }}" readonly>
                            </div>
                            <div class="form-group">
                                <label>Contact Number</label>
                                <input type="text" name="contact_number" value="{{ user['contact_number'] or '' }}">
                            </div>
                            <div class="form-group">
                                <label>Address</label>
                                <input type="text" name="address" value="{{ user['address'] or '' }}">
                            </div>
                            <div class="form-group">
                                <label>Date Joined (Cannot be changed)</label>
                                <input type="text" value="{{ user['created_at'] }}" readonly>
                            </div>
                        </div>
                        <div style="margin-top: 20px;">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                            <a href="/dashboard" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Back to Dashboard
                            </a>
                        </div>
                    </form>
                </div>

                <!-- CHANGE PASSWORD FORM -->
                <div class="password-section">
                    <h3><i class="fas fa-lock" style="margin-right: 8px;"></i> Change Password</h3>
                    <form method="POST" action="{{ url_for('change_password') }}">
                        <div class="info-grid">
                            <div class="form-group">
                                <label>Current Password</label>
                                <div class="password-wrapper">
                                    <input type="password" name="current_password" id="currentPassword" placeholder="Enter current password" required>
                                    <button type="button" class="toggle-password" onclick="togglePassword('currentPassword', this)">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>New Password</label>
                                <div class="password-wrapper">
                                    <input type="password" name="new_password" id="newPassword" placeholder="Enter new password (min. 8 characters)" required>
                                    <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Confirm New Password</label>
                                <div class="password-wrapper">
                                    <input type="password" name="confirm_password" id="confirmPassword" placeholder="Confirm new password" required>
                                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div style="margin-top: 20px;">
                            <button type="submit" class="btn btn-primary" style="background: #c42828;">
                                <i class="fas fa-key"></i> Change Password
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <script>
        // Show / Hide Password
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i class="fas fa-eye-slash"></i>'; // Nagiging closed eye
            } else {
                input.type = 'password';
                btn.innerHTML = '<i class="fas fa-eye"></i>'; // Nagiging open eye
            }
        }

        // Mobile sidebar toggle
        document.addEventListener('DOMContentLoaded', function() {
            const header = document.querySelector('.page-header');
            const hamburger = document.createElement('button');
            hamburger.innerHTML = '<i class="fas fa-bars"></i>';
            hamburger.style.cssText = 'background: none; border: none; font-size: 1.5rem; color: var(--primary-800); cursor: pointer; display: none;';
            hamburger.id = 'menuToggle';
            hamburger.addEventListener('click', function() {
                document.getElementById('sidebar').classList.toggle('open');
            });
            header.prepend(hamburger);

            if (window.innerWidth <= 768) {
                hamburger.style.display = 'block';
            }
            window.addEventListener('resize', function() {
                if (window.innerWidth <= 768) {
                    hamburger.style.display = 'block';
                } else {
                    hamburger.style.display = 'none';
                    document.getElementById('sidebar').classList.remove('open');
                }
            });
        });
    </script>

</body>
</html>
