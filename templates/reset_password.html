<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Barangay Sto. Nino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #065f46 0%, #059669 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .reset-card { 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); 
            padding: 45px 40px; 
            max-width: 460px; 
            width: 100%; 
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #065f46 0%, #059669 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            box-shadow: 0 8px 20px rgba(6, 95, 70, 0.3);
        }
        .reset-card h2 { 
            color: #065f46; 
            text-align: center; 
            margin-bottom: 8px; 
            font-weight: 700;
        }
        .reset-card .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-label {
            color: #475569;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            display: block;
        }
        .form-control { 
            border-radius: 10px; 
            padding: 12px 15px; 
            margin-bottom: 18px; 
            border: 2px solid #e2e8f0;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
            outline: none;
        }
        .code-input {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 10px;
            font-family: 'Courier New', monospace;
            color: #065f46;
        }
        .btn-reset { 
            background: linear-gradient(135deg, #065f46 0%, #059669 100%); 
            border: none; 
            color: white; 
            padding: 14px; 
            border-radius: 10px; 
            width: 100%; 
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(6, 95, 70, 0.3);
            transition: transform 0.2s;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-reset:hover { 
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(6, 95, 70, 0.4);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }
        .back-link a {
            color: #059669;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .back-link a:hover {
            color: #065f46;
        }
        .alert {
            border-radius: 10px;
            font-size: 13px;
            padding: 12px 15px;
            margin-bottom: 20px;
        }
        .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        .alert-success {
            background-color: #f0fdf4;
            color: #065f46;
            border-left: 4px solid #10b981;
        }
        .alert-info {
            background-color: #ecfdf5;
            color: #065f46;
            border-left: 4px solid #059669;
        }
        .hint {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="icon-circle">🔐</div>
        <h2>Reset Password</h2>
        <p class="subtitle">Enter the code sent to your email</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' if category == 'success' else 'info' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('verify_reset_code') }}">
            <label class="form-label">6-Digit Code</label>
            <input type="text" name="code" class="form-control code-input" 
                   placeholder="000000" maxlength="6" pattern="[0-9]{6}" 
                   inputmode="numeric" required autofocus>
            <p class="hint">📧 Check your email inbox (and spam folder)</p>
            
            <label class="form-label">New Password</label>
            <input type="password" name="new_password" class="form-control" 
                   placeholder="At least 8 characters" required minlength="8">
            
            <label class="form-label">Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" 
                   placeholder="Re-enter new password" required minlength="8">
            
            <button type="submit" class="btn-reset">✓ Reset Password</button>
        </form>
        
        <p class="back-link"><a href="{{ url_for('login') }}">← Back to Login</a></p>
    </div>
</body>
</html>
